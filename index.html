<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#183143" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="description" content="Trendy Tax Solutions customer portal demonstration." />
  <title>Client Portal | Trendy Tax Solutions</title>
  <link rel="icon" href="assets/img/brand-mark.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <script src="assets/app.js" defer></script>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="app"></div>
  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false"></div>

  <dialog class="modal" id="upload-dialog" aria-labelledby="upload-dialog-title">
    <form method="dialog" class="modal-frame" id="upload-form">
      <div class="modal-heading">
        <div><div class="eyebrow">YOUR DOCUMENTS</div><h2 id="upload-dialog-title">Add a document</h2><p class="modal-subtitle">Keep a file in this browser for the demo.</p></div>
        <button class="icon-button" type="button" data-close-dialog="upload-dialog" aria-label="Close upload dialog"><span aria-hidden="true">×</span></button>
      </div>
      <label class="drop-zone" id="drop-zone" for="file-input" tabindex="0" role="button">
        <span class="drop-icon" id="drop-icon"></span>
        <strong id="drop-title">Choose a file or drag it here</strong>
        <span id="drop-help">PDF, Word, Excel, images or text · up to 10 MB</span>
      </label>
      <input type="file" id="file-input" class="visually-hidden" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg,.txt,application/pdf,image/png,image/jpeg,text/plain" />
      <div class="field-group upload-category"><label for="document-category">Document category</label><select id="document-category"><option value="Tax documents">Tax documents</option><option value="Statements">Statements</option><option value="Other">Other</option></select></div>
      <p class="inline-hint">Demo only. Files stay on this device, not on a server.</p>
      <div class="modal-actions"><button type="button" class="button button-muted" data-close-dialog="upload-dialog">Cancel</button><button type="submit" class="button button-primary" id="upload-submit">Add document</button></div>
    </form>
  </dialog>

  <dialog class="modal preview-modal" id="preview-dialog" aria-labelledby="preview-dialog-title">
    <div class="modal-frame">
      <div class="modal-heading preview-heading"><div class="truncate"><div class="eyebrow">DOCUMENT PREVIEW</div><h2 id="preview-dialog-title" class="truncate">Document</h2></div><button type="button" class="icon-button" data-close-dialog="preview-dialog" aria-label="Close preview">×</button></div>
      <div id="preview-content" class="preview-content"></div>
      <div class="modal-actions"><button type="button" class="button button-muted" data-close-dialog="preview-dialog">Close</button><button type="button" class="button button-primary" id="preview-download">Download</button></div>
    </div>
  </dialog>

  <dialog class="modal confirm-modal" id="delete-dialog" aria-labelledby="delete-dialog-title">
    <div class="modal-frame"><div class="modal-heading"><div><div class="eyebrow">REMOVE FILE</div><h2 id="delete-dialog-title">Delete document?</h2></div><button type="button" class="icon-button" data-close-dialog="delete-dialog" aria-label="Close">×</button></div><p class="confirm-description" id="delete-description">This file will be removed from this browser.</p><div class="modal-actions"><button type="button" class="button button-muted" data-close-dialog="delete-dialog">Keep document</button><button type="button" class="button button-danger" id="confirm-delete">Delete document</button></div></div>
  </dialog>
</body>
</html>
